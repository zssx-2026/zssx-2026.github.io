<?xml version="1.0" encoding="UTF-8"?>
<!--
  Infinity Games - online games in the window, local games from disk.

  Same tile, same Infinity loop, same construction as the rest of the set.
  Only the figure in the middle changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="8" y="8" width="240" height="240" rx="54" fill="#3D0A1E"/>
  <rect x="8" y="8" width="240" height="120" rx="54" fill="#7A1236"/>

  <!-- a controller: two grips, a body, a d-pad and a button -->
  <polygon points="70,96 186,96 206,150 50,150" fill="#F778BA"/>
  <rect x="86" y="112" width="10" height="26" fill="#0E1116"/>
  <rect x="78" y="120" width="26" height="10" fill="#0E1116"/>
  <circle cx="160" cy="125" r="10" fill="#0E1116"/>

  <circle cx="104" cy="190" r="26" fill="none" stroke="#E6EDF3" stroke-width="13"/>
  <circle cx="152" cy="190" r="26" fill="none" stroke="#E6EDF3" stroke-width="13"/>
  <rect x="104" y="178" width="48" height="24" fill="#E6EDF3"/>
</svg>
