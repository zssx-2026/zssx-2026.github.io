<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account — Infinity.Inc</title>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<main id="app" style="max-width:760px">
  <h1>Account</h1>
  <p class="lede">There is no Infinity account to manage. This page shows the GitHub account the
  suite is acting as, and what it can reach.</p>
  <div id="body"></div>
</main>

<script src="../assets/site.js"></script>
<script>
(function () {
  var I = window.INFINITY;
  I.nav('/myself/');
  I.footer();

  var host = document.getElementById('body');

  if (!I.requireAuth(I.page('/myself/'))) return;
  I.loading(host, 'Reading your account…');

  Promise.all([
    I.gh('/user'),
    I.gh('/user/repos?per_page=100&affiliation=owner&sort=updated')
  ]).then(function (r) {
    var user = r[0];
    var repos = r[1] || [];
    I.clear(host);

    var card = I.el('div', { class: 'card' });
    var head = I.el('div', { class: 'row' });
    head.appendChild(I.el('img', {
      src: user.avatar_url, alt: '',
      style: 'width:56px;height:56px;border-radius:50%'
    }));
    var who = I.el('div');
    who.appendChild(I.el('h2', { style: 'margin:0', text: user.name || user.login }));
    who.appendChild(I.el('div', { class: 'muted small', text: '@' + user.login }));
    head.appendChild(who);
    card.appendChild(head);

    var facts = I.el('table', { style: 'margin-top:16px' });
    var tb = I.el('tbody');
    [
      ['Repositories', I.fmtCount(user.public_repos + (user.total_private_repos || 0))],
      ['Storage repositories', String(repos.filter(function (x) { return x.name.indexOf('inc_') === 0; }).length)],
      ['Token in use', I.token() ? 'yes, in this browser only' : 'none'],
      ['Member since', user.created_at ? I.fmtDate(user.created_at) : '']
    ].forEach(function (row) {
      tb.appendChild(I.el('tr', null, [
        I.el('td', { class: 'muted', style: 'width:200px', text: row[0] }),
        I.el('td', { text: row[1] })
      ]));
    });
    facts.appendChild(tb);
    card.appendChild(facts);
    host.appendChild(card);

    // ---------------------------------------------------------- storage
    var stores = repos.filter(function (x) { return x.name.indexOf('inc_') === 0; });
    var storeCard = I.el('div', { class: 'card' });
    storeCard.appendChild(I.el('h3', { text: 'Cloud storage' }));
    if (!stores.length) {
      storeCard.appendChild(I.el('p', { class: 'muted', text:
        'No repository named inc_… exists yet. Infinity Cloud creates one the first time it ' +
        'stores something.' }));
    } else {
      storeCard.appendChild(I.el('p', { class: 'muted small', text:
        'These repositories hold the cloud drive. Deleting one from GitHub deletes the files ' +
        'in it — do that from GitHub, not from here, so it is a deliberate act.' }));
      var st = I.el('table');
      st.appendChild(I.el('thead', null, [I.el('tr', null, [
        I.el('th', { text: 'Repository' }), I.el('th', { text: 'Visibility' }),
        I.el('th', { class: 'num', text: 'Size' }), I.el('th')
      ])]));
      var sb = I.el('tbody');
      stores.forEach(function (s) {
        sb.appendChild(I.el('tr', null, [
          I.el('td', null, [I.link('https://github.com/' + s.full_name, s.name)]),
          I.el('td', { class: 'muted small', text: s.private ? 'private' : 'public' }),
          I.el('td', { class: 'num', text: I.fmtSize((s.size || 0) * 1024) }),
          I.el('td', null, [I.link(I.page('/cloud/'), 'open', 'small')])
        ]));
      });
      st.appendChild(sb);
      storeCard.appendChild(st);
    }
    host.appendChild(storeCard);

    // ---------------------------------------------------------- sign out
    var out = I.el('div', { class: 'card' });
    out.appendChild(I.el('h3', { text: 'Sign out' }));
    out.appendChild(I.el('p', { class: 'muted small', text:
      'Signing out removes the token from this browser. It does not revoke it — revoke it on ' +
      'GitHub if you think it has been seen by somebody else.' }));
    var row = I.el('div', { class: 'row' });
    var button = I.el('button', { class: 'btn ghost' }, ['Sign out of this browser']);
    button.addEventListener('click', function () {
      I.signOut();
      location.href = I.page('/');
    });
    row.appendChild(button);
    row.appendChild(I.el('a', {
      class: 'btn ghost', target: '_blank', rel: 'noopener',
      href: 'https://github.com/settings/tokens'
    }, ['Manage tokens on GitHub']));
    out.appendChild(row);
    host.appendChild(out);
  }).catch(function (e) {
    I.failure(host, 'Could not read your account: ' + e.message);
  });
})();
</script>
</body>
</html>
