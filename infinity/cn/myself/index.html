<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户 — Infinity.Inc</title>
<meta name="description" content="这里没有需要管理的 Infinity 账户。本页显示这套软件正在以哪个 GitHub 账户行动，以及它能访问什么。">
<link rel="stylesheet" href="../../assets/site.css">
<script src="../../assets/guard.js"></script>
</head>
<body>
<main id="app" style="max-width:760px">
  <h1 data-t="account"></h1>
  <p class="lede" data-t="myselfLede"></p>
  <div id="body"></div>
</main>

<script src="../../assets/site.js"></script>
<script>
(function () {
  var I = window.INFINITY;
  I.applyTranslations();
  I.nav('/myself/');
  I.footer();

  var host = document.getElementById('body');

  if (!I.requireAuth(I.page('/myself/'))) return;
  I.loading(host, I.t('readingAccount'));

  Promise.all([
    I.gh('/user'),
    I.gh('/user/repos?per_page=100&affiliation=owner&sort=updated')
  ]).then(function (r) {
    var user = r[0];
    var repos = r[1] || [];
    I.clear(host);

    var card = I.el('div', { class: 'card' });
    var head = I.el('div', { class: 'row' });
    head.appendChild(I.el('img', {
      src: user.avatar_url, alt: '',
      style: 'width:56px;height:56px;border-radius:50%'
    }));
    var who = I.el('div');
    who.appendChild(I.el('h2', { style: 'margin:0', text: user.name || user.login }));
    who.appendChild(I.el('div', { class: 'muted small', text: '@' + user.login }));
    head.appendChild(who);
    card.appendChild(head);

    var facts = I.el('table', { style: 'margin-top:16px' });
    var tb = I.el('tbody');
    [
      [I.t('repositories'), I.fmtCount(user.public_repos + (user.total_private_repos || 0))],
      [I.t('storageRepos'), String(repos.filter(function (x) { return x.name.indexOf('inc_') === 0; }).length)],
      [I.t('tokenInUse'), I.token() ? I.t('yesBrowserOnly') : I.t('noneWord')],
      [I.t('memberSince'), user.created_at ? I.fmtDate(user.created_at) : '']
    ].forEach(function (row) {
      tb.appendChild(I.el('tr', null, [
        I.el('td', { class: 'muted', style: 'width:200px', text: row[0] }),
        I.el('td', { text: row[1] })
      ]));
    });
    facts.appendChild(tb);
    card.appendChild(facts);
    host.appendChild(card);

    // ---------------------------------------------------------- storage
    var stores = repos.filter(function (x) { return x.name.indexOf('inc_') === 0; });
    var storeCard = I.el('div', { class: 'card' });
    storeCard.appendChild(I.el('h3', { text: I.t('cloudStorage') }));
    if (!stores.length) {
      storeCard.appendChild(I.el('p', { class: 'muted', text: I.t('noStoreYet') }));
    } else {
      storeCard.appendChild(I.el('p', { class: 'muted small', text: I.t('storeWarning') }));
      var st = I.el('table');
      st.appendChild(I.el('thead', null, [I.el('tr', null, [
        I.el('th', { text: I.t('repositoryWord') }),
        I.el('th', { text: I.t('visibilityWord') }),
        I.el('th', { class: 'num', text: I.t('size') }),
        I.el('th')
      ])]));
      var sb = I.el('tbody');
      stores.forEach(function (s) {
        sb.appendChild(I.el('tr', null, [
          I.el('td', null, [I.link('https://github.com/' + s.full_name, s.name)]),
          I.el('td', { class: 'muted small', text: s.private ? I.t('privateWord') : I.t('publicWord') }),
          I.el('td', { class: 'num', text: I.fmtSize((s.size || 0) * 1024) }),
          I.el('td', null, [I.link(I.page('/cloud/'), I.t('openWord'), 'small')])
        ]));
      });
      st.appendChild(sb);
      storeCard.appendChild(st);
    }
    host.appendChild(storeCard);

    // ---------------------------------------------------------- sign out
    var out = I.el('div', { class: 'card' });
    out.appendChild(I.el('h3', { text: I.t('signOutTitle') }));
    out.appendChild(I.el('p', { class: 'muted small', text: I.t('signOutText') }));
    var row = I.el('div', { class: 'row' });
    var button = I.el('button', { class: 'btn ghost' }, [I.t('signOutButton')]);
    button.addEventListener('click', function () {
      I.signOut();
      location.href = I.page('/');
    });
    row.appendChild(button);
    row.appendChild(I.el('a', {
      class: 'btn ghost', target: '_blank', rel: 'noopener',
      href: 'https://github.com/settings/tokens', text: I.t('manageTokens')
    }));
    out.appendChild(row);
    host.appendChild(out);
  }).catch(function (e) {
    I.failure(host, I.t('accountFailed') + ' ' + e.message);
  });
})();
</script>
</body>
</html>
