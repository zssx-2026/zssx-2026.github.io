<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关联产品 — Infinity.Inc</title>
<meta name="description" content="桌面程序打开这个页面来交出一个请求：它把一小段载荷放进地址里，本页把它显示回来。">
<link rel="stylesheet" href="../../../assets/site.css">
</head>
<body>
<main id="app" style="max-width:640px">
  <h1 data-t="linkProduct"></h1>
  <p class="lede" data-t="linkLede"></p>

  <div class="card" id="payload">
    <h3 data-t="requestTitle"></h3>
    <div id="body"></div>
  </div>

  <div class="card" id="actions">
    <h3 data-t="whatHappensNext"></h3>
    <div id="next"></div>
  </div>
</main>

<script src="../../../assets/site.js"></script>
<script>
(function () {
  var I = window.INFINITY;
  I.applyTranslations();
  I.nav('/login/link/');
  I.footer();

  var body = document.getElementById('body');
  var next = document.getElementById('next');

  /*
   * The route is /login/link/<linkid>?="<base64>". The id is the last path
   * segment and the payload is the query, which arrives still wrapped in
   * quotes because that is how the desktop program writes it.
   */
  var parts = location.pathname.replace(/\/+$/, '').split('/');
  var linkId = parts[parts.length - 1] === 'link' ? '' : parts[parts.length - 1];
  var raw = location.search.replace(/^\?/, '');
  var decoded = I.decodePayload(raw);

  function row(label, value, mono) {
    var line = I.el('div', { class: 'row', style: 'margin:4px 0' });
    line.appendChild(I.el('span', { class: 'small muted', style: 'min-width:110px', text: label }));
    line.appendChild(I.el('span', { class: mono ? 'mono small' : '', text: value || '—' }));
    return line;
  }

  I.clear(body);
  body.appendChild(row(I.t('linkIdLabel'), linkId || I.t('noneWord'), true));
  body.appendChild(row(I.t('payloadLabel'), decoded ? decoded.slice(0, 400) : I.t('payloadUndecodable'), true));
  if (decoded.length > 400) {
    body.appendChild(I.el('p', { class: 'small faint', text:
      I.t('showingFirst') + ' 400 ' + I.t('charactersOf') + ' ' + decoded.length + '。' }));
  }

  I.clear(next);

  if (!decoded && !linkId) {
    next.appendChild(I.el('div', { class: 'note warn', text: I.t('noRequestHere') }));
    next.appendChild(I.el('p', null, [I.link(I.page('/download/'), I.t('downloadTitle'))]));
    return;
  }

  if (!I.token()) {
    next.appendChild(I.el('div', { class: 'note', text: I.t('signInToContinue') }));
    next.appendChild(I.el('a', {
      class: 'btn', text: I.t('signInAndContinue'),
      href: I.page('/login/') + '?next=' + encodeURIComponent(location.pathname + location.search)
    }));
  } else {
    next.appendChild(I.el('a', {
      class: 'btn', text: I.t('continueToRun'),
      href: I.page('/run/') + encodeURIComponent(linkId) + '/?=' + encodeURIComponent(raw)
    }));
    next.appendChild(I.el('p', { class: 'small muted', style: 'margin-top:12px', text:
      I.t('signedInAs') + ' ' + (I.user() ? I.user().login : I.t('thisBrowser')) +
      '。' + I.t('runExplains') }));
  }

  // Being signed in already is the common case when a program reopens this
  // page, so the user name is filled in rather than left blank.
  I.verify().catch(function () { I.signOut(); });
})();
</script>
</body>
</html>
