<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档 — Infinity.Inc</title>
<meta name="description" content="直接读取项目自身的文件，所以写在这里的就是代码里说的。">
<link rel="stylesheet" href="../../assets/site.css">
<script src="../../assets/guard.js"></script>
</head>
<body>
<main id="app">
  <h1 data-t="docsTitle"></h1>
  <p class="lede" data-t="docsLede"></p>

  <div class="grid" style="grid-template-columns: 240px 1fr; align-items: start">
    <aside class="card" id="toc" style="position:sticky; top:76px"></aside>
    <article class="card md" id="doc"></article>
  </div>
</main>

<script src="../../assets/site.js"></script>
<script>
(function () {
  var I = window.INFINITY;
  I.applyTranslations();
  I.nav('/docs/');
  I.footer();

  var DOCS = [
    { id: 'readme', title: I.t('docSuite'), path: 'cpp/README.md', note: I.t('docSuiteNote') },
    { id: 'user', title: I.t('docUsing'), path: 'README.md', note: I.t('docUsingNote') },
    { id: 'catalogue', title: I.t('docCatalogue'), path: 'docs/catalogue-format.md',
      note: I.t('docCatalogueNote') }
  ];

  var toc = document.getElementById('toc');
  var host = document.getElementById('doc');

  function pick(id) {
    for (var i = 0; i < DOCS.length; i++) if (DOCS[i].id === id) return DOCS[i];
    return DOCS[0];
  }

  function renderToc(active) {
    I.clear(toc);
    toc.appendChild(I.el('h3', { text: I.t('contents') }));
    DOCS.forEach(function (d) {
      var a = I.el('a', { href: '#' + d.id, class: 'small', text: d.title });
      a.style.display = 'block';
      a.style.padding = '5px 0';
      if (d.id === active) a.style.color = 'var(--ink)';
      a.addEventListener('click', function (e) {
        e.preventDefault();
        location.hash = d.id;
        show(d.id);
      });
      toc.appendChild(a);
    });
  }

  function show(id) {
    var doc = pick(id);
    renderToc(doc.id);
    I.loading(host, I.t('readingFile') + ' ' + doc.path + '…');

    I.gh('/repos/zssx-2026/Infinity.inc/contents/' + doc.path + '?ref=main')
      .then(function (data) {
        if (!data || !data.content) throw new Error(I.t('docEmpty'));
        var text = '';
        try {
          var bin = atob(String(data.content).replace(/\n/g, ''));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          text = new TextDecoder('utf-8').decode(bytes);
        } catch (e) {
          throw new Error(I.t('docDecodeFailed'));
        }
        I.clear(host);
        I.renderMarkdown(host, text);
        host.appendChild(I.el('hr'));
        host.appendChild(I.el('p', { class: 'small faint' }, [
          I.t('sourceLabel') + ' ',
          I.link('https://github.com/zssx-2026/Infinity.inc/blob/main/' + doc.path, doc.path),
          doc.note ? ' — ' + doc.note : ''
        ]));
      })
      .catch(function (e) {
        I.clear(host);
        host.appendChild(I.el('h2', { text: doc.title }));
        host.appendChild(I.el('div', { class: 'note warn', text:
          I.t('docUnreadable') + ' ' + e.message }));
        host.appendChild(I.el('p', { class: 'small muted' }, [
          I.t('publishedInRepo') + ' ',
          I.link('https://github.com/zssx-2026/Infinity.inc/blob/main/' + doc.path, doc.path)
        ]));
        if (/404/.test(e.message)) {
          host.appendChild(I.el('p', { class: 'small faint', text: I.t('docMissing404') }));
        }
      });
  }

  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || 'readme');
})();
</script>
</body>
</html>
