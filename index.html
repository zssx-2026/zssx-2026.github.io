<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>zssx-2026</title>
<meta name="description" content="个人主页">
<style>
  :root{
    --bg:#0b0e14; --text:#e7ecf3; --muted:#94a3b8;
    --accent:#5eead4; --accent2:#818cf8; --radius:16px; --maxw:920px;
    --surface:rgba(255,255,255,.035);
    --surface-2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(620px 400px at 10% -10%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(540px 360px at 90% 2%,  color-mix(in srgb,var(--accent2) 20%, transparent), transparent 70%);
    filter:blur(10px);
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}
  a{color:inherit}

  /* ---------- Hero ---------- */
  header{padding:88px 0 56px; border-bottom:1px solid var(--line)}
  .avatar{position:relative; width:104px; height:104px; margin-bottom:26px}
  .avatar img{width:104px; height:104px; border-radius:50%; object-fit:cover; display:block; border:1px solid var(--line)}
  .avatar .ph{
    width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:42px; font-weight:700; color:var(--bg); letter-spacing:-2px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .avatar::after{
    content:""; position:absolute; inset:-6px; border-radius:50%; z-index:-1;
    background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent));
    filter:blur(14px); opacity:.45;
  }
  h1{
    margin:0 0 12px; font-weight:700; letter-spacing:-1px; font-size:clamp(28px,5vw,40px);
    background:linear-gradient(100deg,var(--text) 20%,var(--accent));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tagline{margin:0 0 26px; color:var(--muted); font-size:17px; max-width:60ch}
  .links{display:flex; flex-wrap:wrap; gap:10px}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:999px;
    font-size:14px; text-decoration:none; color:var(--text);
    background:var(--surface); border:1px solid var(--line);
    transition:transform .18s ease,border-color .18s,background .18s,box-shadow .18s;
  }
  .btn:hover{
    transform:translateY(-2px); background:var(--surface-2);
    border-color:color-mix(in srgb,var(--accent) 55%,transparent);
    box-shadow:0 8px 24px -12px color-mix(in srgb,var(--accent) 60%,transparent);
  }
  .btn svg{width:16px; height:16px; flex:none; opacity:.85}

  /* ---------- Sections ---------- */
  section{padding:52px 0; border-bottom:1px solid var(--line)}
  h2{display:flex; align-items:center; gap:11px; margin:0 0 22px; font-size:19px; font-weight:650}
  h2::before{
    content:""; width:4px; height:19px; border-radius:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
  }
  section p{margin:0 0 14px; color:color-mix(in srgb,var(--text) 84%,transparent)}

  /* ---------- Projects ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
  .card{
    position:relative; display:flex; flex-direction:column; padding:22px;
    border-radius:var(--radius); background:var(--surface); border:1px solid var(--line);
    text-decoration:none; color:inherit;
    transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s,box-shadow .22s;
  }
  .card::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 65%,transparent),transparent 45%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .22s;
  }
  .card:hover{transform:translateY(-4px); background:var(--surface-2); box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
  .card:hover::before{opacity:1}
  .card h3{margin:0 0 10px; font-size:16px; font-weight:600}
  .card:hover h3{color:var(--accent)}
  .card .desc{margin:0 0 16px; color:var(--muted); font-size:14px; flex:1}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
  .tag{
    font-size:11px; padding:3px 9px; border-radius:6px;
    background:color-mix(in srgb,var(--accent) 12%,transparent);
    color:color-mix(in srgb,var(--accent) 88%,white);
  }
  .meta{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--lang,#8b949e); margin-right:6px; display:inline-block}

  /* ---------- Skills ---------- */
  .skills{list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:10px}
  .skills li{
    padding:7px 15px; border-radius:10px; font-size:14px;
    background:var(--surface); border:1px solid var(--line);
    transition:transform .18s,color .18s,border-color .18s;
  }
  .skills li:hover{transform:translateY(-2px); color:var(--accent); border-color:color-mix(in srgb,var(--accent) 50%,transparent)}

  /* ---------- Stats ---------- */
  .stats{display:flex; gap:36px; flex-wrap:wrap}
  .stat b{
    display:block; font-size:30px; font-weight:700; letter-spacing:-1px;
    background:linear-gradient(100deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .stat span{font-size:13px; color:var(--muted)}

  footer{padding:38px 0 64px; color:var(--muted); font-size:13px; text-align:center}

  /* ---------- Motion ---------- */
  .reveal{opacity:0; transform:translateY(18px); transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1; transform:none}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1; transform:none; transition:none}
    html{scroll-behavior:auto}
    .card:hover,.btn:hover,.skills li:hover{transform:none}
  }
  @media (max-width:640px){
    header{padding:52px 0 38px} section{padding:38px 0} .stats{gap:26px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ========== 内嵌配置（自包含）==========
     这是 index.html 自带的默认配置，双击本地打开也能正常渲染。
     若同目录存在 settings.json，会自动加载并覆盖下面同名字段。
     注意：这是 JSON，不能加注释，改完务必保证引号/逗号合法。
========================================== -->
<script id="settings" type="application/json">
{
  "profile": {
    "name": "zssx-2026",
    "title": "个人主页",
    "tagline": "开发者 / 学生 / 正在折腾有意思的小项目",
    "avatar": "",
    "initials": "Z"
  },
  "theme": {
    "bg": "#0b0e14",
    "text": "#e7ecf3",
    "muted": "#94a3b8",
    "accent": "#5eead4",
    "accent2": "#818cf8",
    "radius": "16px",
    "maxWidth": "920px",
    "glow": true
  },
  "sections": {
    "about":   { "show": true, "title": "关于我" },
    "projects":{ "show": true, "title": "项目", "columns": "auto" },
    "skills":  { "show": true, "title": "技能" },
    "stats":   { "show": true, "title": "数据" }
  },
  "links": [
    { "label": "GitHub", "href": "https://github.com/zssx-2026", "icon": "github" },
    { "label": "邮箱",   "href": "mailto:you@example.com",       "icon": "mail"  },
    { "label": "博客",   "href": "/blog/",                       "icon": "link"  }
  ],
  "about": [
    "这里是自我介绍。两三句话讲清楚你是谁、在做什么、对什么感兴趣就够了。",
    "比如：喜欢折腾工具类和自动化项目，目前在学 JavaScript，业余时间做点小玩意儿。"
  ],
  "projects": [
    { "name": "ArchiveTool",    "url": "https://github.com/zssx-2026/ArchiveTool",    "desc": "一句话说清它解决了什么问题、给谁用。", "lang": "JavaScript", "stars": 0, "tags": ["工具"] },
    { "name": "EasyVideo",      "url": "https://github.com/zssx-2026/EasyVideo",      "desc": "一句话说清它解决了什么问题、给谁用。", "lang": "JavaScript", "stars": 0, "tags": ["多媒体"] },
    { "name": "Infinity-Cloud", "url": "https://github.com/zssx-2026/Infinity-Cloud", "desc": "一句话说清它解决了什么问题、给谁用。", "lang": "JavaScript", "stars": 0, "tags": ["云服务"] }
  ],
  "skills": ["JavaScript", "HTML / CSS", "Node.js", "Git", "Python"],
  "stats": [
    { "value": "41+",  "label": "过去一年提交" },
    { "value": "6",    "label": "公开仓库" },
    { "value": "2026", "label": "开始折腾" }
  ],
  "footer": "© 2026 zssx-2026 · Hosted on GitHub Pages"
}
</script>

<script>
(function () {
  'use strict';

  /* ---------- 安全创建 DOM ---------- */
  function el(tag, props, children) {
    props = props || {}; children = children || [];
    var n = document.createElement(tag);
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style') Object.assign(n.style, v);
      else if (k === 'dataset') Object.assign(n.dataset, v);
      else n.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }

  var LANG_COLOR = {
    JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5', Go:'#00ADD8', Rust:'#dea584',
    Java:'#b07219', C:'#555555', 'C++':'#f34b7d', 'C#':'#178600', HTML:'#e34c26', CSS:'#563d7c',
    Vue:'#41b883', Swift:'#F05138', Kotlin:'#A97BFF', Shell:'#89e051', Ruby:'#701516', PHP:'#4F5D95'
  };
  var ICONS = {
    github:{ fill:true,  d:'M12 .5C5.73.5.5 5.73.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.55v-1.94c-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z' },
    mail:{   fill:false, d:'M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Zm2.2.3L12 12.4l6.8-5.6' },
    link:{   fill:false, d:'M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.4 4.5m1.6 6.5a5 5 0 0 0-7.07 0L3.1 13.83a5 5 0 0 0 7.07 7.07L11.4 19.5' },
    twitter:{fill:true,  d:'M18.9 2H22l-7 8 7.9 12h-6.3l-4.9-7.6L5.9 22H2.8l7.4-8.5L2.4 2h6.4l4.6 7.1L18.9 2Z' },
    rss:{    fill:false, d:'M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16M6 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z' }
  };
  var NS = 'http://www.w3.org/2000/svg';
  function icon(name) {
    var c = ICONS[name] || ICONS.link;
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', c.fill ? 'currentColor' : 'none');
    svg.setAttribute('stroke', c.fill ? 'none' : 'currentColor');
    svg.setAttribute('stroke-width', '1.7');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', c.d);
    svg.appendChild(p);
    return svg;
  }

  /* ---------- 主题 ---------- */
  function applyTheme(t) {
    t = t || {};
    var root = document.documentElement.style;
    var map = { bg:'--bg', text:'--text', muted:'--muted', accent:'--accent',
                accent2:'--accent2', radius:'--radius', maxWidth:'--maxw' };
    Object.keys(t).forEach(function (k) { if (map[k] && t[k]) root.setProperty(map[k], t[k]); });
    if (t.glow === false) {
      var s = document.createElement('style');
      s.appendChild(document.createTextNode('body::before{display:none!important}.avatar::after{display:none!important}'));
      document.head.appendChild(s);
    }
  }

  /* ---------- 渲染 ---------- */
  function render(d) {
    var app = document.getElementById('app');
    app.textContent = '';
    var p = d.profile || {}, sec = d.sections || {};

    /* Hero */
    var av = el('div', { class:'avatar' });
    if (p.avatar) av.appendChild(el('img', { src:p.avatar, alt:p.name || 'avatar', loading:'lazy' }));
    else av.appendChild(el('div', { class:'ph', text:String(p.initials || (p.name || '?').slice(0,1)).toUpperCase() }));

    var links = (d.links || []).map(function (l) {
      return el('a', { class:'btn', href:l.href, target:/^https?:/.test(l.href) ? '_blank' : null,
                       rel:/^https?:/.test(l.href) ? 'noopener noreferrer' : null },
               [icon(l.icon), el('span', { text:l.label })]);
    });

    app.appendChild(el('header', {}, [
      av,
      el('h1', { text:p.name || '' }),
      p.tagline ? el('p', { class:'tagline', text:p.tagline }) : null,
      links.length ? el('div', { class:'links' }, links) : null
    ]));

    function section(cfg, body) {
      cfg = cfg || {};
      if (cfg.show === false || !body) return null;
      return el('section', { class:'reveal' }, [el('h2', { text:cfg.title || '' }), body]);
    }

    /* 关于我 */
    var aboutBody = (d.about && d.about.length)
      ? el('div', {}, d.about.map(function (t) { return el('p', { text:t }); })) : null;
    var s1 = section(sec.about, aboutBody); if (s1) app.appendChild(s1);

    /* 项目 */
    var cards = (d.projects || []).map(function (pr) {
      var children = [];
      children.push(el('h3', { text:pr.name }));
      children.push(el('p', { class:'desc', text:pr.desc || '' }));
      if (pr.tags && pr.tags.length)
        children.push(el('div', { class:'tags' }, pr.tags.map(function (t) { return el('span', { class:'tag', text:t }); })));
      var meta = [];
      if (pr.lang) meta.push(el('span', {}, [el('i', { class:'dot', style:{ '--lang': LANG_COLOR[pr.lang] || '#8b949e' } }), pr.lang]));
      if (pr.stars != null) meta.push(el('span', { text:'★ ' + pr.stars }));
      if (meta.length) children.push(el('div', { class:'meta' }, meta));
      return el('a', { class:'card', href:pr.url || '#', target:/^https?:/.test(pr.url || '') ? '_blank' : null,
                       rel:/^https?:/.test(pr.url || '') ? 'noopener noreferrer' : null }, children);
    });
    var grid = cards.length ? el('div', { class:'grid' }, cards) : null;
    if (grid && sec.projects && sec.projects.columns && sec.projects.columns !== 'auto')
      grid.style.gridTemplateColumns = 'repeat(auto-fill,minmax(' + sec.projects.columns + ',1fr))';
    var s2 = section(sec.projects, grid); if (s2) app.appendChild(s2);

    /* 技能 */
    var skillBody = (d.skills && d.skills.length)
      ? el('ul', { class:'skills' }, d.skills.map(function () { return el('li', { text: }); })) : null;
    var s3 = section(sec.skills, skillBody); if (s3) app.appendChild(s3);

    /* 数据 */
    var statBody = (d.stats && d.stats.length)
      ? el('div', { class:'stats' }, d.stats.map(function () {
          return el('div', { class:'stat' }, [el('b', { text:.value }), el('span', { text:.label })]);
        })) : null;
    var s4 = section(sec.stats, statBody); if (s4) app.appendChild(s4);

    app.appendChild(el('footer', {}, [el('p', { text:d.footer || '' })]));

    document.title = [p.name, p.title].filter(Boolean).join(' · ') || '个人主页';
    var md = document.querySelector('meta[name="description"]');
    if (md && p.tagline) md.setAttribute('content', p.tagline);

    /* 滚动淡入 */
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold:.12 });
      Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function (n) { io.observe(n); });
    } else {
      Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function (n) { n.classList.add('in'); });
    }
  }

  /* ---------- 配置来源：内嵌 JSON 为底，settings.json 覆盖 ---------- */
  function readInline() {
    try { return JSON.parse(document.getElementById('settings').textContent); }
    catch (e) { console.error('内嵌配置 JSON 解析失败：', e); return {}; }
  }
  function merge(base, over) {
    var out = {};
    Object.keys(base).forEach(function (k) { out[k] = base[k]; });
    Object.keys(over || {}).forEach(function (k) { out[k] = over[k]; });
    return out;
  }

  var base = readInline();
  render(base);                       // 先用内嵌配置立刻渲染（永远有内容）

  if (location.protocol === 'file:') { // 本地双击打开：跳过 fetch
    console.info('[本地预览] 使用内嵌配置；上传后同目录的 settings.json 会自动生效。');
  } else {
    fetch('./settings.json', { cache:'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (ext) { var merged = merge(base, ext); applyTheme(merged.theme); render(merged); })
      .catch(function (e) { console.info('未加载到 settings.json（' + e.message + '），沿用内嵌配置。'); });
  }
  applyTheme(base.theme);
})();
</script>
</body>
</html>
